<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sauna Tim</title>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <main id="wrap">
    <canvas id="game" width="1280" height="720" aria-label="Sauna Tim"></canvas>
    <div id="orientationHint" aria-hidden="true">Käännä laite vaaka-asentoon</div>

    <section id="instructionsPanel" class="ui-panel" aria-labelledby="instructionsTitle">
      <button id="instructionsClose" class="icon-button" type="button" aria-label="Sulje ohjeet">×</button>
      <h1 id="instructionsTitle">Ohjeet</h1>
      <p>Vedä Timin kauhaa taaksepäin, tähtää kaarella kiukaalle ja päästä irti.</p>
      <p>Tarkempi osuma kuumentaa vastustajaa enemmän. Kun sydänpalkki tyhjenee, kierros ratkeaa.</p>
    </section>

    <button id="instructionsToggle" class="info-button" type="button" aria-label="Näytä ohjeet" hidden>i</button>

    <div id="roundResultDialog" class="round-result" role="dialog" aria-modal="true" aria-labelledby="roundResultTitle" hidden>
      <div class="round-result-card">
        <h1 id="roundResultTitle">Sinä voitit kierroksen!</h1>
        <p id="roundResultText">Paina OK jatkaaksesi.</p>
        <button id="roundResultOk" type="button">OK</button>
      </div>
    </div>
  </main>
  <script src="./src/config.js"></script>
  <script src="./src/utils.js"></script>
  <script src="./src/assets.js"></script>
  <script src="./src/state.js"></script>
  <script src="./src/systems/scoring.js"></script>
  <script src="./src/systems/effects.js"></script>
  <script src="./src/systems/npc.js"></script>
  <script src="./src/systems/progression.js"></script>
  <script src="./src/systems/audio.js"></script>
  <script src="./src/render/primitives.js"></script>
  <script src="./src/render/stove.js"></script>
  <script src="./src/render/characters.js"></script>
  <script src="./src/render/background-cleanup.js"></script>
  <script src="./src/render/thermometers.js"></script>
  <script src="./src/render/hud.js"></script>
  <script src="./src/render/trajectory.js"></script>
  <script src="./src/render/projectile.js"></script>
  <script src="./src/render/effects.js"></script>
  <script src="./src/render/props.js"></script>
  <script src="./src/render/scene.js"></script>
  <script src="./src/input.js"></script>
  <script src="./src/game.js"></script>
  <script src="./src/main.js"></script>
</body>
</html>
